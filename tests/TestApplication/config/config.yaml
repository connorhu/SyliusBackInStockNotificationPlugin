imports:
    - { resource: "@WebgriffeSyliusBackInStockNotificationPlugin/config/packages.yaml" }
    - { resource: "services_test.php" }

doctrine:
    dbal:
        # Symfony Messenger (enabled by the Sylius test application) manages the messenger_messages
        # table itself; its indexes differ from what the schema tool generates on PostgreSQL. The
        # prefix also covers the messenger_messages_id_seq sequence. Not plugin code.
        schema_filter: '~^(?!messenger_messages)~'
