imports:
    - { resource: "@WebgriffeSyliusBackInStockNotificationPlugin/config/packages.yaml" }
    - { resource: "services_test.php" }

doctrine:
    dbal:
        # Symfony Messenger (enabled by the Sylius test application) manages its own table and
        # its indexes differ from what the schema tool generates on PostgreSQL; not plugin code.
        schema_filter: '~^(?!messenger_messages$)~'
