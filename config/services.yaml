services:
    Webgriffe\SyliusBackInStockNotificationPlugin\Command\AlertCommand:
        tags: [ 'console.command' ]
        arguments:
            - '@monolog.logger'
            - '@sylius.email_sender'
            - '@sylius.checker.inventory.availability'
            - '@webgriffe.repository.back_in_stock_notification_subscription'
            - '@router'
    
    Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ManageController:
        tags: [ 'controller.service_arguments' ]
        arguments:
            - '@twig'
            - '@router'
            - '@security.csrf.token_manager'
            - '@webgriffe.repository.back_in_stock_notification_subscription'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Manage\ManageLinkGenerator'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Manage\ManageSession'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Session\CancelUndoSession'
            - '@sylius.context.customer'
            - '@sylius.context.channel'
            - '@sylius.canonicalizer'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Mailer\SafeSender'
            - '@limiter.webgriffe_bisn_manage_link_email'
            - '@limiter.webgriffe_bisn_manage_link_ip'

    Webgriffe\SyliusBackInStockNotificationPlugin\Manage\ManageLinkGenerator:
        arguments:
            - '@router'
            - '@uri_signer'

    Webgriffe\SyliusBackInStockNotificationPlugin\Manage\ManageSession:
        arguments:
            - '@request_stack'

    Webgriffe\SyliusBackInStockNotificationPlugin\Session\CancelUndoSession:
        arguments:
            - '@request_stack'
    
    Webgriffe\SyliusBackInStockNotificationPlugin\Menu\AccountMenuListener:
        tags:
            - { name: kernel.event_listener, event: sylius.menu.shop.account, method: addMenuItems }
    
    Webgriffe\SyliusBackInStockNotificationPlugin\Menu\AdminMenuListener:
        tags:
            - { name: kernel.event_listener, event: sylius.menu.admin.main, method: addAdminMenuItems }
    
    
    Webgriffe\SyliusBackInStockNotificationPlugin\Target\TargetResolver:
        arguments:
            - '%webgriffe_sylius_back_in_stock_notification_plugin.target%'
            - '@webgriffe.repository.back_in_stock_notification_subscription'

    webgriffe.resolver.target: '@Webgriffe\SyliusBackInStockNotificationPlugin\Target\TargetResolver'

    Webgriffe\SyliusBackInStockNotificationPlugin\Processor\SubscriptionProcessor:
        arguments:
            - '@webgriffe.factory.back_in_stock_notification_subscription'
            - '@webgriffe.repository.back_in_stock_notification_subscription'
            - '@sylius.context.channel.cached'
            - '@sylius.context.locale'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Mailer\SafeSender'
            - '@webgriffe.resolver.target'
            - '@webgriffe.resolver.preorderability'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Customer\AccountCustomerFinder'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Session\GuestPreorderSession'
            - '@router'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Manage\ManageLinkGenerator'
            - '@sylius.canonicalizer'
            - '@monolog.logger'

    Webgriffe\SyliusBackInStockNotificationPlugin\Mailer\SafeSender:
        arguments:
            - '@sylius.email_sender'
            - '@monolog.logger'

    Webgriffe\SyliusBackInStockNotificationPlugin\Customer\AccountCustomerFinder:
        arguments:
            - '@sylius.repository.customer'

    Webgriffe\SyliusBackInStockNotificationPlugin\Session\GuestPreorderSession:
        arguments:
            - '@request_stack'

    webgriffe.processor.subscription: '@Webgriffe\SyliusBackInStockNotificationPlugin\Processor\SubscriptionProcessor'

    Webgriffe\SyliusBackInStockNotificationPlugin\Twig\Component\AddNotificationComponent:
        arguments:
            - '@form.factory'
            - '@sylius.resolver.product_variant'
            - '@sylius.context.customer'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Processor\SubscriptionProcessor'
            - '@sylius.repository.product'
            - '@sylius.repository.product_variant'
            - '@Webgriffe\SyliusBackInStockNotificationPlugin\Preorderability\PreorderabilityResolver'
            - '@sylius.context.channel'
            - '@request_stack'
        tags:
            - { name: 'sylius.live_component.shop', key: 'webgriffe:sylius_shop:product:add_notification' }

    webgriffe.factory.back_in_stock_notification_subscription:
        class: Webgriffe\SyliusBackInStockNotificationPlugin\Factory\SubscriptionFactory
        arguments:
            - '%webgriffe.model.back_in_stock_notification_subscription.class%'
            - '@sylius.canonicalizer'

    Webgriffe\SyliusBackInStockNotificationPlugin\Preorderability\PreorderabilityResolver: ~

    webgriffe.resolver.preorderability: '@Webgriffe\SyliusBackInStockNotificationPlugin\Preorderability\PreorderabilityResolver'

    Webgriffe\SyliusBackInStockNotificationPlugin\Form\Extension\ProductPreorderTypeExtension:
        tags: [ 'form.type_extension' ]

    Webgriffe\SyliusBackInStockNotificationPlugin\Form\Extension\TaxonPreorderTypeExtension:
        tags: [ 'form.type_extension' ]

    Webgriffe\SyliusBackInStockNotificationPlugin\Form\Extension\ChannelPreorderTypeExtension:
        tags: [ 'form.type_extension' ]
