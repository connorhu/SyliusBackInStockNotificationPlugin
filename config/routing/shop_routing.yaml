webgriffe_back_in_stock_notification_manage:
    path: /back-in-stock-notification/manage
    methods: [ GET ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ManageController::manageAction

webgriffe_back_in_stock_notification_manage_request:
    path: /back-in-stock-notification/manage/new-link
    methods: [ GET, POST ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ManageController::requestAction

webgriffe_back_in_stock_notification_manage_link_sent:
    path: /back-in-stock-notification/manage/link-sent
    methods: [ GET ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ManageController::linkSentAction

webgriffe_back_in_stock_notification_manage_delete_all:
    path: /back-in-stock-notification/manage/delete-all
    methods: [ POST ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ManageController::deleteAllAction

webgriffe_back_in_stock_notification_manage_restore:
    path: /back-in-stock-notification/manage/restore
    methods: [ POST ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ManageController::restoreAction

webgriffe_back_in_stock_notification_manage_delete:
    path: /back-in-stock-notification/manage/{hash}/delete
    methods: [ POST ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ManageController::deleteAction

webgriffe_back_in_stock_notification_account_list_subscriptions:
    path: /account/back-in-stock-notification
    methods: [ GET ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\AccountController::indexAction

webgriffe_back_in_stock_notification_account_restore:
    path: /account/back-in-stock-notification/restore
    methods: [ POST ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\AccountController::restoreAction

webgriffe_back_in_stock_notification_account_cancel:
    path: /account/back-in-stock-notification/{id}/cancel
    methods: [ POST ]
    requirements:
        id: '\d+'
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\AccountController::cancelAction

webgriffe_back_in_stock_notification_account_dismiss:
    path: /account/back-in-stock-notification/{id}/dismiss
    methods: [ POST ]
    requirements:
        id: '\d+'
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\AccountController::dismissAction

webgriffe_back_in_stock_notification_claim:
    path: /back-in-stock-notification/claim/{hash}
    methods: [ GET ]
    defaults:
        _controller: Webgriffe\SyliusBackInStockNotificationPlugin\Controller\ClaimController::claimAction
