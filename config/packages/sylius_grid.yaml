sylius_grid:
    templates:
        action:
            customer_details: "@WebgriffeSyliusBackInStockNotificationPlugin/admin/subscription/grid/action/customer.html.twig"
    
    grids:
        webgriffe_admin_notification_subscription:
            driver:
                name: doctrine/orm
                options:
                    class: Webgriffe\SyliusBackInStockNotificationPlugin\Entity\Subscription
            fields:
                image:
                    type: twig
                    label: sylius.ui.image
                    path: product
                    options:
                        template: "@SyliusAdmin/product/grid/field/product_image.html.twig"
                        vars:
                            th_class: "w-1"
                product_variant_code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                    path: productVariant.code
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: translation.name
                    path: product.name
                email:
                    type: string
                    label: sylius.ui.email
                created_at:
                    type: datetime
                    label: sylius.ui.date
                    sortable: createdAt
                    options:
                        format: d-m-Y H:i:s
                status:
                    type: twig
                    label: sylius.ui.state
                    options:
                        template: "@WebgriffeSyliusBackInStockNotificationPlugin/admin/subscription/grid/field/status.html.twig"
            filters:
                email:
                    type: string
                    label: sylius.ui.email
                code:
                    type: string
                    label: sylius.ui.code
                    options:
                        fields: [ productVariant.code ]
                created_at:
                    type: date
                    label: sylius.ui.date
                status:
                    type: select
                    label: sylius.ui.state
                    form_options:
                        choices:
                            webgriffe_bisn.status.waiting: waiting
                            webgriffe_bisn.status.notified: notified
                            webgriffe_bisn.status.fulfilled: fulfilled
                            webgriffe_bisn.status.cancelled: cancelled
            actions:
                item:
                    product_details:
                        label: webgriffe_bisn.admin.show_product
                        type: show
                        options:
                            link:
                                route: sylius_admin_product_show
                                parameters:
                                    id: resource.product.id
                    customer_details:
                        label: webgriffe_bisn.admin.show_customer
                        type: customer_details
                        options:
                            link:
                                route: sylius_admin_customer_show
                                data:
                                    customer: resource.customer
                    delete:
                        label: webgriffe_bisn.admin.delete_supscription
                        type: delete
        
        webgriffe_back_in_stock_notification_account_list_subscriptions:
            driver:
                name: doctrine/orm
                options:
                    class: Webgriffe\SyliusBackInStockNotificationPlugin\Entity\Subscription
                    repository:
                        method: createByCustomerIdAndChannelIdQueryBuilder
                        arguments:
                            - "expr:service('sylius.context.customer').getCustomer().getId()"
                            - "expr:service('sylius.context.channel').getChannel().getId()"
            fields:
                product:
                    type: twig
                    label: sylius.ui.product
                    path: product
                    options:
                        template: "@WebgriffeSyliusBackInStockNotificationPlugin/shop/account/subscription/grid/field/product.html.twig"
                product_variant_code:
                    type: string
                    label: sylius.ui.code
                    path: productVariant.code
                status:
                    type: twig
                    label: sylius.ui.state
                    options:
                        template: "@WebgriffeSyliusBackInStockNotificationPlugin/shop/account/subscription/grid/field/status.html.twig"
                created_at:
                    type: datetime
                    label: sylius.ui.date
                    options:
                        format: d-m-Y H:i:s
                delete:
                    type: twig
                    path: hash
                    label: sylius.ui.action
                    options:
                        template: "@WebgriffeSyliusBackInStockNotificationPlugin/shop/account/subscription/grid/field/delete.html.twig"
