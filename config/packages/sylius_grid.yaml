sylius_grid:
    templates:
        action:
            customer_details: "@WebgriffeSyliusBackInStockNotificationPlugin/admin/subscription/grid/action/customer.html.twig"
            cancel_subscription: "@WebgriffeSyliusBackInStockNotificationPlugin/admin/subscription/grid/action/cancel.html.twig"
    
    grids:
        webgriffe_admin_notification_subscription:
            driver:
                name: doctrine/orm
                options:
                    class: Webgriffe\SyliusBackInStockNotificationPlugin\Entity\Subscription
            fields:
                image:
                    type: twig
                    label: sylius.ui.image
                    path: product
                    options:
                        template: "@SyliusAdmin/product/grid/field/product_image.html.twig"
                        vars:
                            th_class: "w-1"
                product:
                    type: string
                    label: sylius.ui.product
                    path: product.name
                variant:
                    type: string
                    label: sylius.ui.variant
                    sortable: productVariant.code
                    path: productVariant.code
                name:
                    type: string
                    label: webgriffe_bisn.admin.subscriber_name
                    sortable: ~
                email:
                    type: string
                    label: sylius.ui.email
                    sortable: ~
                status:
                    type: twig
                    label: sylius.ui.state
                    sortable: ~
                    options:
                        template: "@WebgriffeSyliusBackInStockNotificationPlugin/admin/subscription/grid/field/status.html.twig"
                hold_until:
                    type: datetime
                    label: webgriffe_bisn.admin.hold_until
                    sortable: holdUntil
                    options:
                        format: d-m-Y H:i
                created_at:
                    type: datetime
                    label: sylius.ui.date
                    sortable: createdAt
                    options:
                        format: d-m-Y H:i:s
            filters:
                email:
                    type: string
                    label: sylius.ui.email
                product:
                    type: string
                    label: webgriffe_bisn.admin.product_filter
                    options:
                        fields: [ product.code ]
                channel:
                    type: entity
                    label: sylius.ui.channel
                    form_options:
                        class: "%sylius.model.channel.class%"
                created_at:
                    type: date
                    label: sylius.ui.date
                status:
                    type: select
                    label: sylius.ui.state
                    form_options:
                        choices:
                            webgriffe_bisn.status.waiting: waiting
                            webgriffe_bisn.status.notified: notified
                            webgriffe_bisn.status.fulfilled: fulfilled
                            webgriffe_bisn.status.cancelled: cancelled
            actions:
                item:
                    product_details:
                        label: webgriffe_bisn.admin.show_product
                        type: show
                        options:
                            link:
                                route: sylius_admin_product_show
                                parameters:
                                    id: resource.product.id
                    customer_details:
                        label: webgriffe_bisn.admin.show_customer
                        type: customer_details
                        options:
                            link:
                                route: sylius_admin_customer_show
                                data:
                                    customer: resource.customer
                    cancel:
                        label: webgriffe_bisn.admin.cancel_subscription
                        type: cancel_subscription
                    delete:
                        label: webgriffe_bisn.admin.delete_supscription
                        type: delete
